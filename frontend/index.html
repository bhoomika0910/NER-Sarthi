<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NER-SARTHI | Terrain-Aware Logistics</title>

    <!-- Tailwind and Leaflet are loaded from their CDNs for the initial prototype. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3gKk6v3fYJqW6Z6qJ6v9F1xYx4s="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      #map {
        min-height: 100vh;
      }

      .leaflet-control-attribution {
        font-size: 10px;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: #0f172a;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body class="overflow-hidden bg-slate-950 text-slate-100">
    <main class="relative min-h-screen">
      <div id="map" aria-label="NER-SARTHI road network map"></div>

      <!-- Floating dispatcher controls remain usable over the full-screen map. -->
      <section
        class="absolute left-4 top-4 z-[1000] w-[calc(100%-2rem)] max-w-sm rounded-2xl border border-white/10 bg-slate-950/95 p-5 shadow-2xl backdrop-blur-md sm:left-6 sm:top-6"
        aria-label="Route control panel"
      >
        <div class="mb-5 flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-400">
              NER-SARTHI
            </p>
            <h1 class="mt-1 text-xl font-bold text-white">Terrain-aware dispatch</h1>
          </div>
          <span id="connection-status" class="rounded-full bg-emerald-400/10 px-2.5 py-1 text-xs font-medium text-emerald-300" role="status">
            Online
          </span>
        </div>

        <div id="message" class="mb-4 hidden rounded-lg border px-3 py-2 text-sm" role="status"></div>

        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-300" for="origin">
            Origin
            <select id="origin" class="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2.5 text-sm text-white outline-none transition focus:border-cyan-400">
              <option value="Siliguri">Siliguri</option>
            </select>
          </label>
          <label class="block text-sm font-medium text-slate-300" for="destination">
            Destination
            <select id="destination" class="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2.5 text-sm text-white outline-none transition focus:border-cyan-400">
              <option value="Gangtok">Gangtok</option>
            </select>
          </label>
          <button id="calculate-route" class="w-full rounded-lg bg-cyan-500 px-4 py-2.5 text-sm font-bold text-slate-950 transition hover:bg-cyan-300 disabled:cursor-not-allowed disabled:opacity-50">
            Calculate Route
          </button>
          <button id="simulate-hazard" class="flex w-full items-center justify-center gap-2 rounded-lg border border-amber-400/50 bg-amber-400/10 px-4 py-2.5 text-sm font-semibold text-amber-200 transition hover:bg-amber-400/20 disabled:cursor-not-allowed disabled:opacity-50">
            <span aria-hidden="true">⛈</span>
            Simulate Heavy Monsoon Rainfall
          </button>
        </div>

        <div class="mt-5 border-t border-slate-800 pt-4">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-white">Route comparison</h2>
            <span id="route-status" class="text-xs text-slate-400">Awaiting route</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <article class="rounded-xl bg-slate-900 p-3">
              <p class="text-xs text-slate-400">Standard distance</p>
              <p id="standard-distance" class="mt-1 text-lg font-bold text-blue-300">-- km</p>
              <span id="standard-risk" class="mt-2 inline-flex rounded-full px-2 py-0.5 text-xs font-medium">--</span>
            </article>
            <article class="rounded-xl bg-slate-900 p-3">
              <p class="text-xs text-slate-400">Safe distance</p>
              <p id="safe-distance" class="mt-1 text-lg font-bold text-emerald-300">-- km</p>
              <span id="safe-risk" class="mt-2 inline-flex rounded-full px-2 py-0.5 text-xs font-medium">--</span>
            </article>
          </div>
          <p id="bypass-summary" class="mt-3 text-xs text-slate-400"></p>
        </div>

        <div class="mt-4 flex flex-wrap gap-x-4 gap-y-2 border-t border-slate-800 pt-4 text-xs text-slate-400">
          <span><i class="mr-1 inline-block h-0.5 w-4 bg-blue-400 align-middle"></i> Standard</span>
          <span><i class="mr-1 inline-block h-0.5 w-4 bg-emerald-400 align-middle"></i> Safe bypass</span>
          <span><i class="mr-1 inline-block h-0.5 w-4 border-t-2 border-dashed border-red-400 align-middle"></i> High hazard</span>
        </div>
      </section>
    </main>

    <script>
      const API_BASE = "http://127.0.0.1:8000/api";
      const STORAGE_KEYS = {
        network: "ner-sarthi.network",
        routes: "ner-sarthi.routes",
      };
      const map = L.map("map", { zoomControl: false }).setView([27.15, 88.5], 9);
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      const layers = {
        network: L.layerGroup().addTo(map),
        standard: L.layerGroup().addTo(map),
        safe: L.layerGroup().addTo(map),
      };
      const originSelect = document.getElementById("origin");
      const destinationSelect = document.getElementById("destination");
      const calculateButton = document.getElementById("calculate-route");
      const simulateButton = document.getElementById("simulate-hazard");
      const connectionStatus = document.getElementById("connection-status");

      function setConnectionStatus(isOffline) {
        connectionStatus.textContent = isOffline
          ? "⚡ OFFLINE MODE: Using Cached Terrain Map"
          : "Online";
        connectionStatus.className = isOffline
          ? "rounded-full bg-amber-400/15 px-2.5 py-1 text-xs font-medium text-amber-200"
          : "rounded-full bg-emerald-400/10 px-2.5 py-1 text-xs font-medium text-emerald-300";
        simulateButton.disabled = isOffline;
      }

      function readCache(key) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : null;
        } catch (error) {
          console.warn(`Unable to read cached data for ${key}`, error);
          return null;
        }
      }

      function writeCache(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          console.warn(`Unable to cache data for ${key}`, error);
        }
      }

      function cacheRoutePair(standard, safe) {
        writeCache(STORAGE_KEYS.routes, {
          origin: originSelect.value,
          destination: destinationSelect.value,
          standard,
          safe,
        });
      }

      function showMessage(text, kind = "info") {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = `mb-4 rounded-lg border px-3 py-2 text-sm ${
          kind === "error"
            ? "border-red-400/40 bg-red-400/10 text-red-200"
            : "border-cyan-400/40 bg-cyan-400/10 text-cyan-200"
        }`;
      }

      function riskLabel(score) {
        if (score > 0.75) return { label: "Critical", classes: "bg-red-400/15 text-red-300" };
        if (score > 0.4) return { label: "Moderate", classes: "bg-amber-400/15 text-amber-300" };
        return { label: "Safe", classes: "bg-emerald-400/15 text-emerald-300" };
      }

      function setRiskBadge(elementId, score) {
        const element = document.getElementById(elementId);
        const risk = riskLabel(score);
        element.textContent = risk.label;
        element.className = `mt-2 inline-flex rounded-full px-2 py-0.5 text-xs font-medium ${risk.classes}`;
      }

      async function fetchJson(url, options = {}) {
        const response = await fetch(`${API_BASE}${url}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || `Request failed (${response.status})`);
        }
        return response.json();
      }

      function populateWaypoints(nodes) {
        const selectedOrigin = originSelect.value || "Siliguri";
        const selectedDestination = destinationSelect.value || "Gangtok";
        originSelect.replaceChildren();
        destinationSelect.replaceChildren();
        nodes.forEach((node) => {
          originSelect.add(new Option(node.id, node.id));
          destinationSelect.add(new Option(node.id, node.id));
        });
        originSelect.value = nodes.some((node) => node.id === selectedOrigin) ? selectedOrigin : "Siliguri";
        destinationSelect.value = nodes.some((node) => node.id === selectedDestination) ? selectedDestination : "Gangtok";
      }

      function renderNetwork(network) {
        layers.network.clearLayers();
        network.edges.forEach((edge) => {
          const isHazardous = edge.status === "BLOCKED_OR_CRITICAL" || edge.risk_score > 0.75;
          L.polyline(edge.coordinates, {
            color: isHazardous ? "#f87171" : "#64748b",
            weight: isHazardous ? 4 : 2,
            opacity: isHazardous ? 0.95 : 0.65,
            dashArray: isHazardous ? "8 8" : undefined,
          })
            .bindPopup(`<strong>${edge.name}</strong><br>Risk: ${(edge.risk_score * 100).toFixed(0)}%`)
            .addTo(layers.network);
        });
        network.nodes.forEach((node) => {
          L.circleMarker(node.coordinates, {
            radius: 4,
            color: "#e2e8f0",
            weight: 1,
            fillColor: "#0891b2",
            fillOpacity: 1,
          })
            .bindTooltip(node.id)
            .addTo(layers.network);
        });
        populateWaypoints(network.nodes);
      }

      function renderRoute(layer, route, color, weight) {
        layer.clearLayers();
        L.polyline(route.coordinates, { color, weight, opacity: 0.95 }).addTo(layer);
      }

      function updateComparison(standard, safe) {
        document.getElementById("standard-distance").textContent = `${standard.total_distance_km.toFixed(1)} km`;
        document.getElementById("safe-distance").textContent = `${safe.total_distance_km.toFixed(1)} km`;
        setRiskBadge("standard-risk", standard.average_route_risk);
        setRiskBadge("safe-risk", safe.average_route_risk);
        document.getElementById("bypass-summary").textContent =
          `${safe.segments_bypassed_due_to_hazard} hazardous segment(s) bypassed by the safe route.`;
        document.getElementById("route-status").textContent = "Routes calculated";
      }

      async function calculateRoutes() {
        calculateButton.disabled = true;
        try {
          const cachedRoutes = readCache(STORAGE_KEYS.routes);
          if (!navigator.onLine) {
            if (!cachedRoutes || !cachedRoutes.safe || !cachedRoutes.standard) {
              throw new Error("No cached route is available for offline use.");
            }
            renderRoute(layers.standard, cachedRoutes.standard, "#60a5fa", 4);
            renderRoute(layers.safe, cachedRoutes.safe, "#34d399", 5);
            updateComparison(cachedRoutes.standard, cachedRoutes.safe);
            showMessage("Showing the last calculated routes from local cache.");
            return;
          }
          const request = {
            origin: originSelect.value,
            destination: destinationSelect.value,
          };
          const [standard, safe] = await Promise.all([
            fetchJson("/route", { method: "POST", body: JSON.stringify({ ...request, mode: "standard" }) }),
            fetchJson("/route", { method: "POST", body: JSON.stringify({ ...request, mode: "safe" }) }),
          ]);
          cacheRoutePair(standard, safe);
          renderRoute(layers.standard, standard, "#60a5fa", 4);
          renderRoute(layers.safe, safe, "#34d399", 5);
          updateComparison(standard, safe);
        } catch (error) {
          const cachedRoutes = readCache(STORAGE_KEYS.routes);
          if (cachedRoutes && cachedRoutes.standard && cachedRoutes.safe) {
            renderRoute(layers.standard, cachedRoutes.standard, "#60a5fa", 4);
            renderRoute(layers.safe, cachedRoutes.safe, "#34d399", 5);
            updateComparison(cachedRoutes.standard, cachedRoutes.safe);
            showMessage("Live route unavailable. Showing the last calculated routes from local cache.", "error");
          } else {
            showMessage(error.message, "error");
          }
        } finally {
          calculateButton.disabled = false;
        }
      }

      async function simulateHazard() {
        simulateButton.disabled = true;
        try {
          if (!navigator.onLine) {
            showMessage("Hazard simulation requires a network connection.", "error");
            return;
          }
          await fetchJson("/simulate-hazard", {
            method: "POST",
            body: JSON.stringify({
              center_lat: 27.07,
              center_lng: 88.52,
              radius_km: 30,
              rainfall_mm: 120,
            }),
          });
          const network = await fetchJson("/network");
          writeCache(STORAGE_KEYS.network, network);
          renderNetwork(network);
          showMessage("120 mm monsoon event applied to the Teesta valley.");
          await calculateRoutes();
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          simulateButton.disabled = false;
        }
      }

      calculateButton.addEventListener("click", calculateRoutes);
      simulateButton.addEventListener("click", simulateHazard);
      window.addEventListener("offline", () => {
        setConnectionStatus(true);
        showMessage("⚡ OFFLINE MODE: Using Cached Terrain Map.");
      });
      window.addEventListener("online", () => {
        setConnectionStatus(false);
        showMessage("Connection restored. Live terrain data is available.");
      });

      const cachedNetwork = readCache(STORAGE_KEYS.network);
      setConnectionStatus(!navigator.onLine);
      if (cachedNetwork) {
        renderNetwork(cachedNetwork);
      }
      if (navigator.onLine) {
        fetchJson("/network")
          .then((network) => {
            writeCache(STORAGE_KEYS.network, network);
            renderNetwork(network);
            return calculateRoutes();
          })
          .catch((error) => {
            if (!cachedNetwork) {
              showMessage(`API unavailable and no cached terrain map exists: ${error.message}`, "error");
            } else {
              showMessage("API unavailable. Showing the cached terrain map.", "error");
              calculateRoutes();
            }
          });
      } else if (cachedNetwork) {
        calculateRoutes();
      } else {
        showMessage("Offline and no cached terrain map is available.", "error");
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.warn("Service worker registration failed", error);
        });
      }
    </script>
  </body>
</html>
